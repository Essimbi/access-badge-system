<div class="gate-list-page">
    <div class="page-header">
        <h1 class="page-header__title">Terminaux de Contrôle d'Accès</h1>
        <div class="page-header__actions">
            <button mat-raised-button color="primary">
                <mat-icon>add_to_queue</mat-icon>
                Enregistrer un Terminal
            </button>
        </div>
    </div>

    <div class="table-container bg-white rounded-lg border shadow-sm overflow-hidden">
        <div *ngIf="loading" class="flex justify-center items-center p-8">
            <mat-spinner diameter="40"></mat-spinner>
        </div>

        <table mat-table [dataSource]="dataSource" *ngIf="!loading && dataSource.data.length > 0; else emptyState">

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> ID Terminal </th>
                <td mat-cell *matCellDef="let gate">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-slate-100 flex items-center justify-center">
                            <mat-icon class="text-slate-400 text-sm w-4 h-4">devices</mat-icon>
                        </div>
                        <span class="font-bold text-slate-900">{{gate.name}}</span>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="location">
                <th mat-header-cell *matHeaderCellDef> Emplacement </th>
                <td mat-cell *matCellDef="let gate"> {{gate.location}} </td>
            </ng-container>

            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef> Type </th>
                <td mat-cell *matCellDef="let gate">
                    <mat-chip-set>
                        <mat-chip class="text-[10px] uppercase font-bold">{{gate.type}}</mat-chip>
                    </mat-chip-set>
                </td>
            </ng-container>

            <ng-container matColumnDef="organization">
                <th mat-header-cell *matHeaderCellDef> Client / Org </th>
                <td mat-cell *matCellDef="let gate"> {{gate.organizationName}} </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> État </th>
                <td mat-cell *matCellDef="let gate">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full" [ngClass]="gate.is_active ? 'bg-green-500' : 'bg-red-500'">
                        </div>
                        <span class="text-xs font-medium">{{ gate.is_active ? 'Connecté' : 'Hors-ligne' }}</span>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let gate">
                    <button mat-icon-button (click)="toggleGateStatus(gate)"
                        [matTooltip]="gate.is_active ? 'Déconnecter' : 'Reconnecter'">
                        <mat-icon [color]="gate.is_active ? 'warn' : 'primary'">{{ gate.is_active ? 'link_off' : 'link'
                            }}</mat-icon>
                    </button>
                    <button mat-icon-button (click)="openGateSettings(gate)" matTooltip="Paramètres avancés">
                        <mat-icon>settings</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>

        <ng-template #emptyState>
            <div class="p-12 text-center text-gray-400">
                <mat-icon class="text-5xl opacity-20">sensors_off</mat-icon>
                <p class="mt-2">Aucun terminal enregistré.</p>
            </div>
        </ng-template>
    </div>
</div>
