<div class="audit-logs-page">
    <div class="page-header">
        <h1 class="page-header__title">Logs d'Audit Système</h1>
        <div class="page-header__actions">
            <button mat-stroked-button>
                <mat-icon>download</mat-icon>
                Exporter (.log)
            </button>
        </div>
    </div>

    <mat-card class="overflow-hidden">
        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef> Date </th>
                <td mat-cell *matCellDef="let log" class="text-gray-500 font-mono text-xs"> {{log.date | date:'medium'}}
                </td>
            </ng-container>

            <ng-container matColumnDef="severity">
                <th mat-header-cell *matHeaderCellDef> Sévérité </th>
                <td mat-cell *matCellDef="let log">
                    <span class="px-2 py-1 rounded text-[10px] font-bold uppercase" [ngClass]="{
                            'bg-blue-100 text-blue-700': log.severity === 'info',
                            'bg-orange-100 text-orange-700': log.severity === 'warning',
                            'bg-red-100 text-red-700': log.severity === 'error'
                        }">
                        {{log.severity}}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="user">
                <th mat-header-cell *matHeaderCellDef> Utilisateur </th>
                <td mat-cell *matCellDef="let log" class="font-medium"> {{log.user}} </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef> Action </th>
                <td mat-cell *matCellDef="let log">
                    <code class="text-xs bg-slate-100 text-slate-700 px-1 rounded">{{log.action}}</code>
                </td>
            </ng-container>

            <ng-container matColumnDef="details">
                <th mat-header-cell *matHeaderCellDef> Détails </th>
                <td mat-cell *matCellDef="let log" class="text-slate-600 italic"> {{log.details}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 20, 50, 100]" showFirstLastButtons></mat-paginator>
    </mat-card>
</div>
