<button mat-icon-button [matMenuTriggerFor]="alertsMenu" class="alerts-button">
  <mat-icon [matBadge]="unreadCount" matBadgeColor="warn" matBadgeSize="small">
    notifications
  </mat-icon>
</button>

<mat-menu #alertsMenu="matMenu" class="alerts-menu">
  <div class="alerts-menu-header">
    <h3 class="text-sm font-bold">Alertes ({{ alerts.length }})</h3>
    <button mat-icon-button (click)="clearAllAlerts()" *ngIf="alerts.length > 0" matTooltip="Effacer tout">
      <mat-icon class="text-sm">clear_all</mat-icon>
    </button>
  </div>

  <mat-divider></mat-divider>

  <div *ngIf="alerts.length === 0" class="alerts-empty">
    <mat-icon class="text-slate-300">notifications_none</mat-icon>
    <p class="text-sm text-slate-500">Aucune alerte</p>
  </div>

  <mat-list *ngIf="alerts.length > 0" class="alerts-list">
    <mat-list-item *ngFor="let alert of alerts" class="alert-item" [ngClass]="'alert-' + alert.type">
      <mat-icon matListItemIcon [color]="getAlertColor(alert.type)">
        {{ getAlertIcon(alert.type) }}
      </mat-icon>
      <div matListItemTitle class="font-semibold">{{ alert.title }}</div>
      <div matListItemLine class="text-xs">{{ alert.message }}</div>
      <div matListItemLine class="text-xs text-slate-500">
        {{ alert.timestamp | date:'HH:mm' }}
      </div>
      <button mat-icon-button matListItemMeta (click)="clearAlert(alert)" class="text-slate-400">
        <mat-icon class="text-sm">close</mat-icon>
      </button>
    </mat-list-item>
  </mat-list>
</mat-menu>
