<header class="header-3cm">
    <div class="header-3cm__container">
        <!-- Section gauche -->
        <div class="header-3cm__left">
            <!-- Bouton menu mobile -->
            <button mat-icon-button class="header-3cm__menu-btn" aria-label="Menu">
                <mat-icon>menu</mat-icon>
            </button>
            
            <!-- Logo et branding 3CM simplifié -->
            <div class="header-3cm__brand">
                <div class="header-3cm__logo-container">
                    <img src="/assets/images/3cm-logo.jpg" alt="3CM Logo" class="header-3cm__logo" />
                </div>
                <div class="header-3cm__brand-text">
                    <h1 class="header-3cm__brand-name">ABS</h1>
                </div>
            </div>
        </div>

        <!-- Section droite -->
        <div class="header-3cm__right">
            <!-- Actions rapides -->
            <div class="header-3cm__actions">
                <!-- Bouton d'aide -->
                <button mat-icon-button 
                        class="header-3cm__action-btn" 
                        matTooltip="Centre d'aide"
                        matTooltipPosition="below">
                    <mat-icon>help_outline</mat-icon>
                </button>

                <!-- Bouton notifications -->
                <button mat-icon-button 
                        class="header-3cm__action-btn header-3cm__notifications" 
                        matTooltip="Notifications"
                        matTooltipPosition="below"
                        [matBadge]="notificationCount" 
                        [matBadgeHidden]="notificationCount === 0"
                        matBadgeColor="accent"
                        matBadgeSize="small">
                    <mat-icon>notifications_outline</mat-icon>
                </button>

                <!-- Bouton de thème -->
                <button mat-icon-button 
                        class="header-3cm__action-btn" 
                        (click)="toggleTheme()" 
                        matTooltip="{{ isDarkMode ? 'Mode clair' : 'Mode sombre' }}"
                        matTooltipPosition="below">
                    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
                </button>

                <!-- Bouton plein écran -->
                <button mat-icon-button 
                        class="header-3cm__action-btn" 
                        (click)="toggleFullscreen()"
                        matTooltip="Plein écran"
                        matTooltipPosition="below">
                    <mat-icon>{{ isFullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
                </button>
            </div>

            <!-- Séparateur -->
            <div class="header-3cm__divider"></div>

            <!-- Menu utilisateur amélioré -->
            <button mat-button 
                    [matMenuTriggerFor]="userMenu" 
                    class="header-3cm__user-btn"
                    aria-label="Menu utilisateur">
                <div class="header-3cm__user-info">
                    <div class="header-3cm__user-avatar">
                        <span class="header-3cm__user-initials">{{ getUserInitials() }}</span>
                        <div class="header-3cm__user-status" 
                             [class.header-3cm__user-status--online]="isUserOnline"></div>
                    </div>
                    <div class="header-3cm__user-details" *ngIf="currentUser">
                        <span class="header-3cm__user-name">{{ currentUser.firstName }} {{ currentUser.lastName }}</span>
                        <span class="header-3cm__user-role">{{ getRoleLabel(currentUser.role) }}</span>
                    </div>
                    <mat-icon class="header-3cm__user-arrow">keyboard_arrow_down</mat-icon>
                </div>
            </button>

            <!-- Menu utilisateur -->
            <mat-menu #userMenu="matMenu" xPosition="before" class="header-3cm__user-menu">
                <!-- En-tête du menu utilisateur -->
                <div class="header-3cm__menu-header" *ngIf="currentUser">
                    <div class="header-3cm__menu-avatar">
                        <span>{{ getUserInitials() }}</span>
                    </div>
                    <div class="header-3cm__menu-user-info">
                        <div class="header-3cm__menu-user-name">{{ currentUser.firstName }} {{ currentUser.lastName }}</div>
                        <div class="header-3cm__menu-user-email">{{ currentUser.email }}</div>
                        <span class="header-3cm__menu-user-badge">{{ getRoleLabel(currentUser.role) }}</span>
                    </div>
                </div>
                
                <mat-divider></mat-divider>
                
                <!-- Actions du menu -->
                <button mat-menu-item routerLink="/dashboard/participant/profile" *ngIf="hasRole('participant')">
                    <mat-icon>person_outline</mat-icon>
                    <span>Mon Profil</span>
                    <span class="header-3cm__menu-shortcut">Ctrl+P</span>
                </button>
                
                <button mat-menu-item routerLink="/dashboard/organizations/my" *ngIf="hasRole('admin')">
                    <mat-icon>business</mat-icon>
                    <span>Mon Organisation</span>
                </button>
                
                <button mat-menu-item routerLink="/dashboard/system/settings" *ngIf="hasRole('super_admin')">
                    <mat-icon>settings</mat-icon>
                    <span>Paramètres Système</span>
                </button>
                
                <button mat-menu-item (click)="openThemeDemo()" *ngIf="hasRole('super_admin')">
                    <mat-icon>palette</mat-icon>
                    <span>Charte Graphique</span>
                </button>

                <button mat-menu-item>
                    <mat-icon>account_circle</mat-icon>
                    <span>Préférences</span>
                </button>

                <button mat-menu-item>
                    <mat-icon>security</mat-icon>
                    <span>Sécurité</span>
                </button>
                
                <mat-divider></mat-divider>
                
                <button mat-menu-item (click)="logout()" class="header-3cm__menu-logout">
                    <mat-icon>logout</mat-icon>
                    <span>Déconnexion</span>
                </button>
            </mat-menu>
        </div>
    </div>
</header>
